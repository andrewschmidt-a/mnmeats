		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/meat.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full bg-accent" height="">
